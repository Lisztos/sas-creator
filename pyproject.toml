[project]
name = "sas-creator"
version = "0.1.0"
description = "Automated browser agent for SAS company creation on tuempresa.gob.mx"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
sas-creator = "sas_creator.__main__:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
