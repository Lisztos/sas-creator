site:
  base_url: "https://sas-tuempresa.economia.gob.mx/sas/"
  page_load_timeout_ms: 120000
  ajax_settle_timeout_ms: 30000
  navigation_timeout_ms: 120000

credentials:
  cer_path: "./credentials/certificate.cer"
  key_path: "./credentials/private_key.key"
  # password loaded from .env: SAS_KEY_PASSWORD

retry:
  base_interval_seconds: 300
  max_interval_seconds: 1800
  exponential_base: 2
  jitter_seconds: 30
  max_attempts: 0  # 0 = infinite

telegram:
  # token loaded from .env: TELEGRAM_BOT_TOKEN
  chat_id: ""
  notify_on_step_success: true
  notify_on_error: true
  notify_on_human_needed: true
  send_screenshots: true

browser:
  headless: false
  slow_mo_ms: 100
  viewport_width: 1280
  viewport_height: 900
  user_data_dir: "./browser_data"

state:
  state_file: "./state/run_state.json"
  screenshot_dir: "./screenshots"

logging:
  level: "DEBUG"
  file: "./logs/sas_creator.log"
  max_bytes: 10485760
  backup_count: 5
